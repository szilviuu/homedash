<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EC5FC"/>
      <stop offset="100%" stop-color="#E0C3FC"/>
    </linearGradient>

    <!-- Glass panel gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>

    <!-- Calendar header gradient -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6CAB"/>
      <stop offset="100%" stop-color="#7366FF"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="20" y="20" width="260" height="260" rx="50" fill="url(#bgGrad)"/>

  <!-- Glass panel -->
  <rect x="40" y="60" width="220" height="200" rx="25"
        fill="url(#glassGrad)"
        stroke="rgba(255,255,255,0.5)"
        stroke-width="2"
        filter="url(#shadow)"
        style="backdrop-filter: blur(10px);"/>

  <!-- Calendar header -->
  <rect x="40" y="60" width="220" height="60" rx="25"
        fill="url(#headerGrad)" />

  <!-- Binding rings -->
  <circle cx="95" cy="60" r="10" fill="#ffffffaa"/>
  <circle cx="150" cy="60" r="10" fill="#ffffffaa"/>
  <circle cx="205" cy="60" r="10" fill="#ffffffaa"/>

  <!-- Date text -->
  <text x="150" y="180"
        font-family="Segoe UI, sans-serif"
        font-size="90"
        text-anchor="middle"
        fill="#ffffffdd"
        font-weight="700">
    12
  </text>

  <!-- Month label -->
  <text x="150" y="215"
        font-family="Segoe UI, sans-serif"
        font-size="28"
        text-anchor="middle"
        fill="#ffffffcc"
        font-weight="400">
    MAR
  </text>
</svg>