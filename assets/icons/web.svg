<svg width="300" height="300" viewBox="0 0 300 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Glassy globe gradient -->
    <radialGradient id="globeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="40%" stop-color="#6EC6FF"/>
      <stop offset="100%" stop-color="#005BEA"/>
    </radialGradient>

    <!-- Glass orbit gradient -->
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.75)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>

    <!-- Glow under orbit -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.22"/>
    </filter>
  </defs>


  <!-- Globe (background) -->
  <circle cx="150" cy="150" r="90"
          fill="url(#globeGrad)"
          filter="url(#shadow)"/>

  <!-- Light reflection top-left -->
  <ellipse cx="120" cy="115" rx="45" ry="30"
           fill="rgba(255,255,255,0.25)"
           transform="rotate(-20 120 115)"/>

  <!-- Latitude highlight lines (glassy) -->
  <ellipse cx="150" cy="150" rx="70" ry="25"
           stroke="rgba(255,255,255,0.35)" fill="none" stroke-width="4"/>
  <ellipse cx="150" cy="150" rx="50" ry="15"
           stroke="rgba(255,255,255,0.25)" fill="none" stroke-width="3"/>

  <!-- Rotating orbit group -->
  <g transform="rotate(45 150 150)">
    <ellipse id="orbit" cx="150" cy="150" rx="120" ry="45"
             fill="none" stroke="url(#orbitGrad)" stroke-width="12"
             stroke-linecap="round"
             filter="url(#softGlow)">

      <!-- Animation: full rotation in 5 seconds -->
      <animateTransform attributeName="transform"
                        attributeType="XML"
                        type="rotate"
                        from="0 150 150"
                        to="360 150 150"
                        dur="5s"
                        repeatCount="indefinite"/>
    </ellipse>
  </g>

</svg>