<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     aria-label="Jellyfin" role="img"
     viewBox="0 0 512 512" fill="#000000">

  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
  <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
  <g id="SVGRepo_iconCarrier">
    <rect width="512" height="512" rx="15%" fill="#ffffff"></rect>

    <defs>
      <!-- Original paths -->
      <path id="A" d="M190.56 329.07c8.63 17.3 122.4 17.12 130.93 0 8.52-17.1-47.9-119.78-65.46-119.8-17.57 0-74.1 102.5-65.47 119.8z"></path>

      <linearGradient id="B" gradientUnits="userSpaceOnUse" x1="126.15" y1="219.32" x2="457.68" y2="410.73">
        <stop offset="0%" stop-color="#aa5cc3"/>
        <stop offset="100%" stop-color="#00a4dc"/>
      </linearGradient>

      <path id="C" d="M58.75 417.03c25.97 52.15 368.86 51.55 394.55 0S308.93 56.08 256.03 56.08c-52.92 0-223.25 308.8-197.28 360.95zm68.04-45.25c-17.02-34.17 94.6-236.5 129.26-236.5 34.67 0 146.1 202.7 129.26 236.5-16.83 33.8-241.5 34.17-258.52 0z"></path>

      <!-- Proper clipPath: use the two paths so animation stays inside emblem -->
      <clipPath id="emblemClip">
        <use xlink:href="#A"/>
        <use xlink:href="#C"/>
      </clipPath>

      <!-- Soft blur for the moving flare -->
      <filter id="flareBlur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>

      <!-- Inner glow gradient (pulses opacity) -->
      <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="white" stop-opacity="0.28">
          <animate attributeName="stop-opacity" values="0.28;0.12;0.28" dur="3.5s" repeatCount="indefinite"/>
        </stop>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </radialGradient>

      <!-- Flare gradient (bright band in the middle, transparent edges) -->
      <linearGradient id="flareGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="white" stop-opacity="0"/>
        <stop offset="45%"  stop-color="white" stop-opacity="0.85"/>
        <stop offset="55%"  stop-color="white" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- Original emblem fills -->
    <use xlink:href="#A" fill="url(#B)"/>
    <use xlink:href="#A" fill-opacity="0" stroke="#000000" stroke-opacity="0"/>
    <use xlink:href="#C" fill="url(#B)"/>
    <use xlink:href="#C" fill-opacity="0" stroke="#000000" stroke-opacity="0"/>

    <!-- Subtle inner glow overlay (pulsing), clipped to emblem -->
    <g clip-path="url(#emblemClip)">
      <rect x="0" y="0" width="512" height="512" fill="url(#innerGlow)"/>
    </g>

    <!-- Animated sweeping flare:
         A large rectangle with the flare gradient, rotated ~25°,
         and rotated continuously around center for a sweeping effect. -->
    <g clip-path="url(#emblemClip)" opacity="0.9" pointer-events="none">
      <g transform="translate(256,256)">
        <g transform="rotate(25)">
          <rect x="-700" y="-700" width="1400" height="1400" fill="url(#flareGrad)" filter="url(#flareBlur)">
            <!-- Continuous rotation around center -->
            <animateTransform attributeName="transform"
                              type="rotate"
                              from="0"
                              to="360"
                              dur="7s"
                              repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>
  </g>
</svg>